[project]
name = "jarvis"
version = "0.7.4"
description = "Jarvis - An AI voice assistant inspired by Iron Man"
readme = "README.md"
requires-python = ">=3.12"
# Everything here runs on this machine. Nothing in the default install talks to
# a third party service.
dependencies = [
    "comtypes>=1.4",
    "faster-whisper>=1.0",
    "httpx>=0.27",
    "mcp>=1.2",
    "numpy>=1.26",
    # Drawing the numbered boxes and taking screenshots. In the base install
    # rather than an extra because screen.marks_file is on by default, and a
    # default that needs an extra installed is a default that does not work.
    "pillow>=10.0",
    "psutil>=6.0",
    "pyaudio>=0.2.14",
    "speechrecognition>=3.17.0",
]

[project.optional-dependencies]
# Opt in, and NOT local: sends every reply to Microsoft's Edge TTS service in
# exchange for a much better neural voice.
edge = ["edge-tts>=6.1", "pygame>=2.6"]
# CUDA runtime for Whisper, without a system CUDA install. Buys about 0.2s per
# utterance and costs ~340MB of VRAM, most of it the CUDA context rather than
# the model - so it is worth it only if the GPU is otherwise idle.
cuda = ["nvidia-cublas-cu12>=12.4", "nvidia-cudnn-cu12>=9,<10"]
# Global hotkey support (Pause/Break key to pause transcription). Optional -
# install with `uv sync --extra hotkey` if you want the shortcut.
hotkey = ["keyboard>=0.13"]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
