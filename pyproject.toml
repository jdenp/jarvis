[project]
name = "jarvis"
version = "0.3.1"
description = "Jarvis - An AI voice assistant inspired by Iron Man"
readme = "README.md"
requires-python = ">=3.12"
# Everything here runs on this machine. Nothing in the default install talks to
# a third party service.
dependencies = [
    "comtypes>=1.4",
    "faster-whisper>=1.0",
    "httpx>=0.27",
    "mcp>=1.2",
    "numpy>=1.26",
    "psutil>=6.0",
    "pyaudio>=0.2.14",
    "speechrecognition>=3.17.0",
]

[project.optional-dependencies]
# Opt in, and NOT local: sends every reply to Microsoft's Edge TTS service in
# exchange for a much better neural voice.
edge = ["edge-tts>=6.1", "pygame>=2.6"]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
