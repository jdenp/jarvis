[project]
name = "jarvis"
version = "0.20.1"
description = "Jarvis - A local voice and computer-use assistant for Windows"
readme = "README.md"
requires-python = ">=3.12"
# Everything here runs on this machine. Nothing in the default install talks to
# a third party service.
dependencies = [
    "comtypes>=1.4",
    "faster-whisper>=1.0",
    "httpx>=0.27",
    "numpy>=1.26",
    # Drawing the numbered boxes and taking screenshots. In the base install
    # rather than an extra because screen.marks_file is on by default, and a
    # default that needs an extra installed is a default that does not work.
    "pillow>=10.0",
    "pyaudio>=0.2.14",
    "speechrecognition>=3.17.0",
]

[project.optional-dependencies]
# Opt in, and NOT local: sends every reply to Microsoft's Edge TTS service in
# exchange for a much better neural voice.
edge = ["edge-tts>=6.1", "pygame>=2.6"]
# An 82M neural voice that stays on this machine, in exchange for a 330MB model
# you download once by hand. Add onnxruntime-gpu yourself if you want tts.kokoro_device
# set to cuda; on CPU it is around 5x real time on a modern desktop chip.
kokoro = ["kokoro-onnx>=0.4", "onnxruntime>=1.20"]
# CUDA runtime for Whisper, without a system CUDA install. Buys about 0.2s per
# utterance and costs ~340MB of VRAM, most of it the CUDA context rather than
# the model - so it is worth it only if the GPU is otherwise idle.
cuda = ["nvidia-cublas-cu12>=12.4", "nvidia-cudnn-cu12>=9,<10"]
# Subtracting this machine's own output from the microphone, so a video playing
# on the speakers is not transcribed as if somebody said it. PyAudioWPatch is a
# PyAudio fork that adds WASAPI loopback, which is how the reference signal is
# captured; it sits alongside pyaudio rather than replacing it.
echo = ["PyAudioWPatch>=0.2.12", "pywebrtc-audio>=0.1"]
# Global hotkey support (Pause/Break key to pause transcription). Optional -
# install with `uv sync --extra hotkey` if you want the shortcut.
hotkey = ["keyboard>=0.13"]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
